<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 648" width="600" height="648">
  <defs>
    <radialGradient id="grad-field-notebook" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#bfdbfe" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#bfdbfe" stop-opacity="1"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background with subtle lighting -->
  <rect width="600" height="648" fill="url(#grad-field-notebook)"/>
  <!-- Decorative Grid / Frame -->
  <rect x="30" y="30" width="540" height="588" rx="18" fill="none" stroke="rgba(26,26,24,0.06)" stroke-width="2"/>
  <!-- Category Watermark -->
  <text x="300" y="110" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="rgba(26,26,24,0.3)" text-anchor="middle" text-transform="uppercase">SHIPYARD OBJECT ARCHIVE</text>
  <!-- Product Illustration -->
  <g filter="url(#shadow)">
    
      <!-- Notebook Cover Shadow -->
      <rect x="204" y="214" width="200" height="260" rx="14" fill="rgba(26,26,24,0.15)"/>
      <!-- Notebook Cover -->
      <rect x="195" y="205" width="200" height="260" rx="14" fill="#1e3a8a"/>
      <!-- Spine -->
      <rect x="195" y="205" width="28" height="260" rx="6" fill="#172554"/>
      <line x1="223" y1="205" x2="223" y2="465" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
      <!-- Ribbon Bookmark -->
      <path d="M 270 205 L 270 330 L 285 315 L 300 330 L 300 205 Z" fill="#ef4444"/>
      <!-- Embossed Logo -->
      <rect x="250" y="350" width="90" height="40" rx="4" fill="none" stroke="#93c5fd" stroke-width="2"/>
      <line x1="262" y1="365" x2="328" y2="365" stroke="#93c5fd" stroke-width="2"/>
      <line x1="262" y1="375" x2="310" y2="375" stroke="#93c5fd" stroke-width="2"/>
    
  </g>
  <!-- Product Title Stamp -->
  <text x="300" y="565" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="500" font-style="italic" fill="#1a1a18" text-anchor="middle">Field Notebook</text>
  <text x="300" y="590" font-family="'DM Mono', monospace" font-size="11" letter-spacing="2" fill="rgba(26,26,24,0.5)" text-anchor="middle">EDITION 2026 // REF: FIELD-NOTEBOOK</text>
</svg>