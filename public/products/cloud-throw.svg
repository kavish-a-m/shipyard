<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 648" width="600" height="648">
  <defs>
    <radialGradient id="grad-cloud-throw" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="1"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background with subtle lighting -->
  <rect width="600" height="648" fill="url(#grad-cloud-throw)"/>
  <!-- Decorative Grid / Frame -->
  <rect x="30" y="30" width="540" height="588" rx="18" fill="none" stroke="rgba(26,26,24,0.06)" stroke-width="2"/>
  <!-- Category Watermark -->
  <text x="300" y="110" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="rgba(26,26,24,0.3)" text-anchor="middle" text-transform="uppercase">SHIPYARD OBJECT ARCHIVE</text>
  <!-- Product Illustration -->
  <g filter="url(#shadow)">
    
      <!-- Stacked Throw Blanket Layers -->
      <!-- Bottom Layer -->
      <rect x="180" y="380" width="240" height="60" rx="16" fill="#0369a1" stroke="#1a1a18" stroke-width="8"/>
      <!-- Middle Layer -->
      <rect x="195" y="315" width="220" height="60" rx="16" fill="#0284c7" stroke="#1a1a18" stroke-width="8"/>
      <!-- Top Layer -->
      <rect x="210" y="250" width="200" height="60" rx="16" fill="#38bdf8" stroke="#1a1a18" stroke-width="8"/>
      <!-- Woven Texture Pattern -->
      <line x1="230" y1="265" x2="390" y2="265" stroke="#e0f2fe" stroke-width="3" stroke-dasharray="6 4"/>
      <line x1="230" y1="285" x2="390" y2="285" stroke="#e0f2fe" stroke-width="3" stroke-dasharray="6 4"/>
      <!-- Fringe details -->
      <line x1="190" y1="440" x2="190" y2="455" stroke="#1a1a18" stroke-width="4"/>
      <line x1="205" y1="440" x2="205" y2="455" stroke="#1a1a18" stroke-width="4"/>
      <line x1="220" y1="440" x2="220" y2="455" stroke="#1a1a18" stroke-width="4"/>
      <line x1="235" y1="440" x2="235" y2="455" stroke="#1a1a18" stroke-width="4"/>
    
  </g>
  <!-- Product Title Stamp -->
  <text x="300" y="565" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="500" font-style="italic" fill="#1a1a18" text-anchor="middle">Cloud Throw</text>
  <text x="300" y="590" font-family="'DM Mono', monospace" font-size="11" letter-spacing="2" fill="rgba(26,26,24,0.5)" text-anchor="middle">EDITION 2026 // REF: CLOUD-THROW</text>
</svg>