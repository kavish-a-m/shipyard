<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 648" width="600" height="648">
  <defs>
    <radialGradient id="grad-wave-runner" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#d9f99d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#d9f99d" stop-opacity="1"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background with subtle lighting -->
  <rect width="600" height="648" fill="url(#grad-wave-runner)"/>
  <!-- Decorative Grid / Frame -->
  <rect x="30" y="30" width="540" height="588" rx="18" fill="none" stroke="rgba(26,26,24,0.06)" stroke-width="2"/>
  <!-- Category Watermark -->
  <text x="300" y="110" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="rgba(26,26,24,0.3)" text-anchor="middle" text-transform="uppercase">SHIPYARD OBJECT ARCHIVE</text>
  <!-- Product Illustration -->
  <g filter="url(#shadow)">
    
      <!-- Wireless Headphones -->
      <path d="M 200 340 A 100 100 0 0 1 400 340" fill="none" stroke="#1a1a18" stroke-width="18" stroke-linecap="round"/>
      <path d="M 185 320 A 115 115 0 0 1 415 320" fill="none" stroke="rgba(26,26,24,0.3)" stroke-width="4" stroke-linecap="round"/>
      <!-- Left Earcup -->
      <rect x="180" y="310" width="40" height="75" rx="20" fill="#1a1a18"/>
      <rect x="172" y="325" width="16" height="46" rx="8" fill="#4d7c0f"/>
      <!-- Right Earcup -->
      <rect x="380" y="310" width="40" height="75" rx="20" fill="#1a1a18"/>
      <rect x="412" y="325" width="16" height="46" rx="8" fill="#4d7c0f"/>
      <!-- Sound waves -->
      <path d="M 150 335 A 40 40 0 0 0 150 365" fill="none" stroke="#4d7c0f" stroke-width="4" stroke-linecap="round"/>
      <path d="M 450 335 A 40 40 0 0 1 450 365" fill="none" stroke="#4d7c0f" stroke-width="4" stroke-linecap="round"/>
    
  </g>
  <!-- Product Title Stamp -->
  <text x="300" y="565" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="500" font-style="italic" fill="#1a1a18" text-anchor="middle">Wave Runner</text>
  <text x="300" y="590" font-family="'DM Mono', monospace" font-size="11" letter-spacing="2" fill="rgba(26,26,24,0.5)" text-anchor="middle">EDITION 2026 // REF: WAVE-RUNNER</text>
</svg>