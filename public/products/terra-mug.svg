<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 648" width="600" height="648">
  <defs>
    <radialGradient id="grad-terra-mug" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#fecdd3" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fecdd3" stop-opacity="1"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background with subtle lighting -->
  <rect width="600" height="648" fill="url(#grad-terra-mug)"/>
  <!-- Decorative Grid / Frame -->
  <rect x="30" y="30" width="540" height="588" rx="18" fill="none" stroke="rgba(26,26,24,0.06)" stroke-width="2"/>
  <!-- Category Watermark -->
  <text x="300" y="110" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="rgba(26,26,24,0.3)" text-anchor="middle" text-transform="uppercase">SHIPYARD OBJECT ARCHIVE</text>
  <!-- Product Illustration -->
  <g filter="url(#shadow)">
    
      <!-- Steam -->
      <path d="M 270 190 Q 280 160 265 140" fill="none" stroke="#be123c" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
      <path d="M 300 185 Q 315 150 295 130" fill="none" stroke="#be123c" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
      <path d="M 330 190 Q 340 160 325 140" fill="none" stroke="#be123c" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
      <!-- Handle -->
      <path d="M 360 270 C 430 270 430 380 360 380" fill="none" stroke="#1a1a18" stroke-width="18" stroke-linecap="round"/>
      <!-- Mug Body -->
      <path d="M 210 240 L 230 420 Q 230 440 250 440 L 350 440 Q 370 440 370 420 L 390 240 Z" fill="#9f1239" stroke="#1a1a18" stroke-width="10"/>
      <!-- Glaze Dip -->
      <path d="M 210 240 Q 300 280 390 240 L 385 300 Q 300 340 215 300 Z" fill="#f43f5e" opacity="0.8"/>
      <!-- Rim -->
      <ellipse cx="300" cy="240" rx="90" ry="18" fill="#fecdd3" stroke="#1a1a18" stroke-width="8"/>
    
  </g>
  <!-- Product Title Stamp -->
  <text x="300" y="565" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="500" font-style="italic" fill="#1a1a18" text-anchor="middle">Terra Mug</text>
  <text x="300" y="590" font-family="'DM Mono', monospace" font-size="11" letter-spacing="2" fill="rgba(26,26,24,0.5)" text-anchor="middle">EDITION 2026 // REF: TERRA-MUG</text>
</svg>