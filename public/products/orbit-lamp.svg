<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 648" width="600" height="648">
  <defs>
    <radialGradient id="grad-orbit-lamp" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#fed7aa" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="1"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background with subtle lighting -->
  <rect width="600" height="648" fill="url(#grad-orbit-lamp)"/>
  <!-- Decorative Grid / Frame -->
  <rect x="30" y="30" width="540" height="588" rx="18" fill="none" stroke="rgba(26,26,24,0.06)" stroke-width="2"/>
  <!-- Category Watermark -->
  <text x="300" y="110" font-family="'DM Sans', system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="4" fill="rgba(26,26,24,0.3)" text-anchor="middle" text-transform="uppercase">SHIPYARD OBJECT ARCHIVE</text>
  <!-- Product Illustration -->
  <g filter="url(#shadow)">
    
      <!-- Base -->
      <ellipse cx="300" cy="450" rx="90" ry="16" fill="#1a1a18"/>
      <!-- Stem -->
      <line x1="300" y1="450" x2="300" y2="280" stroke="#1a1a18" stroke-width="12" stroke-linecap="round"/>
      <!-- Orbit ring -->
      <ellipse cx="300" cy="270" rx="110" ry="42" fill="none" stroke="#c2410c" stroke-width="6" stroke-dasharray="8 6"/>
      <!-- Luminous Globe -->
      <circle cx="300" cy="270" r="58" fill="#ffffff" stroke="#1a1a18" stroke-width="8"/>
      <circle cx="282" cy="252" r="16" fill="#fed7aa" opacity="0.8"/>
      <circle cx="300" cy="270" r="70" fill="none" stroke="#ea580c" stroke-width="2" opacity="0.4"/>
    
  </g>
  <!-- Product Title Stamp -->
  <text x="300" y="565" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="500" font-style="italic" fill="#1a1a18" text-anchor="middle">Orbit Lamp</text>
  <text x="300" y="590" font-family="'DM Mono', monospace" font-size="11" letter-spacing="2" fill="rgba(26,26,24,0.5)" text-anchor="middle">EDITION 2026 // REF: ORBIT-LAMP</text>
</svg>